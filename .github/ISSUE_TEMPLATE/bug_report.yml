name: Bug report
description: Something isn't working the way it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search [existing issues](../../issues) first to avoid a duplicate.

        **Found a security vulnerability instead?** Please don't file it here — see [SECURITY.md](../../blob/main/SECURITY.md) for how to report it privately.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The more precise, the faster this gets fixed.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      multiple: true
      options:
        - Canvas / spatial workspace
        - Task / Group editing
        - Auth (login, signup, sessions, 2FA)
        - Organization / Void / Team management
        - Notifications
        - Search / My Tasks
        - Realtime sync
        - Something else
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Browser + version:
        - OS:
        - Void version/commit (if self-hosting):
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, or other context
      description: Drag and drop images directly into this box.
    validations:
      required: false
