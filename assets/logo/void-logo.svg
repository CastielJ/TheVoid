    <linearGradient id="ring-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.15" />
