  <circle cx="60" cy="60" r="42" stroke="url(#ring-soft)" stroke-width="1.5" />
  <circle cx="60" cy="60" r="31" fill="url(#core)" stroke="url(#ring)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="6.5" fill="url(#ring)" />

  <text
    x="148"
    y="78"
    font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="56"
